<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Quiet Vault</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14101c; }
  /* Keep the 1280x720 arena whole on any window: fit by width or height. */
  #game {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    display: block;
    touch-action: none;
    background: #23202b;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="The Quiet Vault: sneak through the bank vault hall, grab three loot and slip out the exit without tripping the alarm"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
